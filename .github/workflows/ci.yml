name: deterministic-skill-ci

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Skill structure and retained-capability validation
        run: |
          python -B management-skill/scripts/global_skill_regression_gate.py check --project-root . --skills-dir . --mode source --output Cache/temp-ci/global-skill-gate.json
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: skill-validation-${{ matrix.python-version }}
          path: Cache/temp-ci/
