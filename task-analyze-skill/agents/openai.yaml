interface:
  display_name: "Task Analyze"
  short_description: "Always-first per-task model and effort router"
  default_prompt: >-
    $task-analyze-skill: read only Task Analyze at entry. Literal extraction uses local tool+Mini; semantic source work uses one adaptive producer. Resolve entry once, defer owner/source reads to the child, show one route and launch same turn. Never inspect implementation/session/cache. Use one preset with adaptive_model_runner --emit-result; fixed receipt is never fallback. Pass no source root with json-object. Read-only children name their owner and use --ignore-user-config. With functions.exec use outer 60s yield, 30s launch, 55s write_stdin polls. When runner status and Mini pass, call no more tools or source checks: return its result once immediately, never Ending/Real or duplicate commentary.
