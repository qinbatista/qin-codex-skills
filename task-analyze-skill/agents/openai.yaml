interface:
  display_name: "Task Analyze"
  short_description: "Always-first per-task model and effort router"
  default_prompt: >-
    $task-analyze-skill: resolve the exact entry pair, show the route, then hand off to workflow-skill. Finish, Mini Verify, and show the basically verified result first; only then release Ending Task. Direct tools use their installed skill and observable Mini check with no child model, receipt, or adaptive sample. Model nodes use owner/domain and static floors, then an effort-first ladder; reuse the calibrated selected_pair with trial=false. The entry pair is never learned. Record model producers after Mini and update after Real.
