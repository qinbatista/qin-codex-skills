interface:
  display_name: "Task Analyze"
  short_description: "Always-first per-task model and effort router"
  default_prompt: >-
    Start every task with Task Analyze only. In bounded preflight call resolve_entry_model.py; use its exact pair or unverified only on failure. Show the human easy/complex route, then execute through workflow-skill. Direct obvious reversible tool actions skip the dispatcher; complex nodes need topology and receipts. First Result Principle: Mini Verify releases a basically verified result immediately; Ending Task owns deeper proof and reopens on later correctness failure. Downstream Python/C#/Unity C# uses code-skill and Spark first with separate execution-domain evidence. Apply static floors before private model_experience.json: no success uses static, except safe low-risk text-only tiny work starts Spark-low; passes lower same-model effort before the next weaker model; quality failures upgrade one exact pair rung. Record the result producer after Mini and update it after Real.
