interface:
  display_name: "Task Analyze"
  short_description: "Routing, benchmarks, maintenance, and admitted graph strategy"
  default_prompt: >-
    $task-analyze-skill:score every task 0-100;resolve entry;show score/band plus route change;2+ stages=>per-stage graph;final Model stages includes every difficulty/pair/status.task-type/step/difficulty history picks lowest-correct;Sol/high may downgrade;Luna-max/lower may upgrade;no-history starts at/below entry.obsidian_adaptive_model_runner.py;exact/tool/image uses task_complexity_score.py.Small low-risk edit <=24 tries Spark-low;quality failure suppresses its matching band.End Task is hard-required.ending_verification_plan.py;scored/model projectless End/check;create-launches->codex_app__create_thread->ack-launch(threadId+hostId)->audit-launches=100%;all must PASS.PASS records then self-archives;FAIL/BLOCKED stays visible.FAIL=>separate projectless Fix with exact error;fresh verification;up to three attempts.BLOCKED never means verified.Local lifecycle always records;receipt events=>Obsidian;entry/selected/effective/next.Never emulate task creation;same-task subagent forbidden;never self-verify.
