interface:
  display_name: "Task Analyze"
  short_description: "Report Skill use and deliver action requests"
  default_prompt: "Use $task-analyze-skill. Report exact Skill names and short purposes before tools at startup, in every progress update and phase transition, and in the final actual-use list, including branches. Announce new Skills before use; distinguish planned and applied use. Preview result, difficulty, known models, branches and dependencies. Deliver requested work, repair recoverable failures, and stop only for evidenced blockers. Lead with delivered changes and separate verification limits. Never invent success or a model ID."
