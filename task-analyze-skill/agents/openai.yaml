interface:
  display_name: "Task Analyze"
  short_description: "Selected-model skill execution and independent-task routing"
  default_prompt: >-
    Use the selected model and effort to understand governing skills and relevant project memory,
    define task goals, and complete skill-governed work. Route only independent tasks adaptively.
    Verify complex changes in the active task with bounded checks; skip simple value edits.
    Ending only summarizes scoped memory with the selected model. Missing memory is optional.
