interface:
  display_name: "Task Analyze"
  short_description: "Carry action requests through execution and recovery"
  default_prompt: "Use $task-analyze-skill to briefly explain the result, qualitative difficulty, known model assignments, parallel branches and real dependencies. Deliver the requested work, repair recoverable failures, and stop only for evidenced blockers after useful available routes are exhausted. Lead with delivered changes and separate verification limits. Never invent success or a model ID."
