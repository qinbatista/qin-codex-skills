interface:
  display_name: "Task Analyze"
  short_description: "Routing, benchmarks, maintenance, and admitted graph strategy"
  default_prompt: >-
    $task-analyze-skill:score 0-100;resolve entry;show band/route.2+ stages=>per-stage graph;final Model stages has every difficulty/pair/status.History picks lowest-correct;entry moves up/down;no-history<=entry.Use obsidian_adaptive_model_runner.py;only artifact-free exact/tool/image uses task_complexity_score.py.Small low-risk edit<=24 tries Spark-low;quality FAIL suppresses band.Every result requires End Task in exact saved project.Use ending_verification_plan.py;project/local End/check;create-launches(projectId)->create_thread->ack(threadId+hostId+projectId)->audit=100%;all PASS,visible,never auto-archive/delete.Assessment:stage difficulty/pairs,attempt,first/retry,suitability,next route,Obsidian link.No receipt still records non-learning observation.FAIL=>same-project Fix+fresh End<=3.BLOCKED is not verified.Never emulate;same-task/self-verify forbidden.
