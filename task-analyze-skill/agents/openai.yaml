interface:
  display_name: "Task Analyze"
  short_description: "Always-first per-task model and effort router"
  default_prompt: >-
    $task-analyze-skill: resolve the exact entry pair, optionally search one bounded related-memory digest, show the route, then hand off to workflow-skill. Missing memory is a no-op. Non-tiny routes use the full Luna-low-to-Sol-ultra ladder; tiny eligible routes prepend Spark-low. Recompute private routing before dispatch and reuse frozen selected_pair. Mini PASS is provisional until Ending Real updates the producer and related sanitized memory. The private ledger remains pair authority.
