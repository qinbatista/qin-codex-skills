interface:
  display_name: "Task Analyze"
  short_description: "Routing, benchmarks, maintenance, and admitted graph strategy"
  default_prompt: >-
    $task-analyze-skill:score every task 0-100;resolve entry;show score/band plus route change.2+ stages=>per-stage graph;final Model stages includes every difficulty/pair/status.History picks lowest-correct;entry can move up/down;no-history<=entry.Use obsidian_adaptive_model_runner.py;exact/tool/image uses task_complexity_score.py.Small low-risk edit <=24 tries Spark-low;quality failure suppresses its band.Every result requires End Task in the exact saved project.Use ending_verification_plan.py;scored/model project/local End/check;create-launches(projectId)->codex_app__create_thread->ack-launch(threadId+hostId+projectId)->audit-launches=100%;all PASS and remain visible;never auto-archive/delete.Model assessment:stage difficulty/pairs,attempt count,first/retry pass,suitability,next pair/action,Obsidian link.FAIL=>same-project Fix;fresh verification<=3.BLOCKED is not verified.Local+Obsidian records.Never emulate task creation;same-task/self-verify forbidden.
