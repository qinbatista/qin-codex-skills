interface:
  display_name: "Task Analyze"
  short_description: "Routing, benchmarks, maintenance, and admitted graph strategy"
  default_prompt: >-
    $task-analyze-skill: score every task 0-100, resolve entry, and show score/band plus route change. Matching task-type/step/difficulty history picks lowest-correct; Sol/high may downgrade, Luna-max/lower may upgrade, and no-history starts at/below entry. Text/code uses obsidian_adaptive_model_runner.py; exact/tool/image uses task_complexity_score.py. Small low-risk edit <=24 tries Spark-low; quality failure suppresses its matching band and upgrades next time. End Task is hard-required. ending_verification_plan.py gives one own scored/model global projectless task per independent real check; all must PASS. PASS records then self-archives; FAIL/BLOCKED stays visible. FAIL creates a separate projectless repair task with exact error, then fresh verification, up to three attempts. BLOCKED never means verified. Local lifecycle always records; receipt-backed terminal events sync Obsidian with entry/selected/effective/next and difficulty. Never emulate task creation, use a same-task subagent, or self-verify.
