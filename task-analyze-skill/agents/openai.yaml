interface:
  display_name: "Task Analyze"
  short_description: "Always-first per-task model and effort router"
  default_prompt: >-
    $task-analyze-skill: resolve the exact entry pair, show the route, then hand off to workflow-skill. Every non-tiny model route uses the exact full Luna-low-to-Sol-ultra ladder without Spark; a tiny eligible route uses exactly Spark-low plus that full normal fallback. Recompute the private recommendation before dispatch. Reuse frozen selected_pair with trial=false. For mini_real, Mini PASS is provisional until Ending Real updates the same producer run. Cost-rank only complete Real-passing pairs in the same workload-hash cohort; otherwise use the quality boundary. The entry pair is never learned.
