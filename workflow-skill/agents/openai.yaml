interface:
  display_name: "Workflow Skill"
  short_description: "Start with a workflow diagram, then route the task"
  default_prompt: "Use $workflow-skill to show the required start diagram, then show a task-specific Workflow with models numbered list before real task action. Each step label must include the model in parentheses, e.g. 1. Plan route (best available workflow model), 2. Patch text/prompt/code (gpt-5.3-code-spark / gpt-5.3-codex-spark), 3. Verify result (best available verification model). Fast-path simple obvious low-risk actions such as open a site, run one status/read command, or change/rename A to B without formal target maps, verify-skill, reports, optimization, or Obsidian recording. Run the Prompt Task Gate before generic text/code routing. Workflow creation, route decisions, image/comprehensive reading, verification judgment, and final judgment use the best available reasoning/verification model by default. Force actual execution including ordinary text writing, prompt/rule edits, command-line/simple checks, shell/Git interpretation, log/wiki/DailyLog/Obsidian/Markdown edits, optimization implementation, Python/C# code writing, and code tests/probes to GPT-5.3-Codex-Spark unless image reading, comprehensive reading/checking, deep review, or final judgment is required. After verification passes, return the user-facing result immediately; run secondary logging/wiki/Markdown closeout in the background when available."
