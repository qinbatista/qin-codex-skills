interface:
  display_name: "Workflow Skill"
  short_description: "Start with a workflow diagram, then route the task"
  default_prompt: "Use $workflow-skill to show the required start diagram, then show a task-specific Workflow with models numbered list before real task action. Each step label must include the model in parentheses, e.g. 1. Plan route (best available workflow model), 2. Patch text/prompt/code (gpt-5.3-codex-spark), 3. Mini test result (best available verification model). Hard gate: if the Workflow with models list was not shown before explicit workflow tool/file/browser/code action, stop and show it first; if already missed, correct the route and redo the affected step. Fast-path simple obvious low-risk actions such as open a site, run one status/read command, or change/rename A to B show the compact direct-route diagram plus one-line model route, then do direct action and minimal confirmation only: no formal target maps, verify-skill, reports, optimization, or Obsidian recording before answering. Run the Prompt Task Gate before generic text/code routing. Workflow creation, route decisions, image/comprehensive reading, verification judgment, and final judgment use the best available reasoning/verification model by default. Force actual execution including ordinary text writing, prompt/rule edits, command-line/simple checks, shell/Git interpretation, log/wiki/DailyLog/Obsidian/Markdown edits, optimization implementation, Python/C# code writing, and code tests/probes to GPT-5.3-Codex-Spark unless image reading, comprehensive reading/checking, deep review, or final judgment is required. After the direct fast-path result or foreground mini real test passes, return the user-facing result immediately; extended tests, log checks, docs, sync/status, or memory closeout are background/deferred. If a background check later fails, reopen the task with the failing evidence."
