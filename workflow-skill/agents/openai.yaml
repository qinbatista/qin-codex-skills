interface:
  display_name: "Workflow"
  short_description: "Executes the locked per-node route"
  default_prompt: >-
    Use workflow-skill after task-analyze-skill returns a visible locked plan. Validate installed skills, exact model plus effort, dependencies, Mini Verify placement, Main Result before Ending Task, and Python/C# routing through code-skill. Do not inherit the entry model or silently redesign the plan. Execute dependencies and parallel branches as planned, keeping runtime receipts when model proof is required. Mini Verify is the first-result gate. After it passes, show the main result, then dispatch background Ending Task branches for Real Verify, independent optimization verification, reports, logs, docs, memory, and related closeout. A background correctness failure must notify the user and reopen the task.

