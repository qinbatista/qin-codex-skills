interface:
  display_name: "Workflow"
  short_description: "Executes admitted complex delegated routes"
  default_prompt: >-
    $workflow-skill: eligible small low-risk edits try Spark; other producers use matching Obsidian context and the saved highest-family quality pair. One Real PASS keeps it, two PASS trial one rung down, and quality FAIL upgrades one; operational failure is quality-neutral. Publish output after Quick Check. Every result launches ending_verification_plan.py in the exact saved project and creates one scored/modelled project/local task per independent check; all must PASS and remain visible. Never auto-archive/delete. Terminal output includes difficulty/pairs, attempts, first/retry pass, suitability, next route, and Obsidian link. FAIL records evidence, creates a same-project repair task, then fresh verification, up to three attempts. Never expose private reasoning, self-verify, or use a same-task subagent.
