interface:
  display_name: "Workflow"
  short_description: "Executes admitted complex delegated routes"
  default_prompt: >-
    $workflow-skill: eligible small low-risk edits try Spark; other producers use matching Obsidian context and the saved highest-family quality pair. One receipt-backed Real PASS keeps it, two PASS trial down, quality FAIL upgrades; operational failure is neutral. Publish after Quick Check. Every result launches ending_verification_plan.py in the exact saved project and creates one scored/modelled project/local task per check; all PASS and remain visible. Never auto-archive/delete. Terminal output includes difficulty/pairs, attempts, first/retry, suitability, next route, and Obsidian link; no receipt writes a non-learning observation. FAIL creates same-project repair then fresh verification, up to three. Never expose private reasoning, self-verify, or use a same-task subagent.
