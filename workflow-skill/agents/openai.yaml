interface:
  display_name: "Workflow"
  short_description: "Executes the locked per-node route"
  default_prompt: >-
    $workflow-skill: execute the locked route without inheriting the entry pair. Preserve only relevant bounded memory context; missing memory is a no-op. Model nodes keep exact pair, owner/domain, topology, and receipts. Mini releases the result first; Ending Real updates the producer, routing learning, and related sanitized memory. Route active code domains through code-skill.
