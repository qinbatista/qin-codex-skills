interface:
  display_name: "Workflow"
  short_description: "Executes the locked per-node route"
  default_prompt: >-
    Use workflow-skill after task-analyze-skill returns a visible locked plan. Direct obvious reversible tool actions execute without a dispatcher; complex nodes preserve exact model|effort, dependencies, topology, and receipts. Mini Verify is the First Result Principle gate: show the basically verified result immediately, then dispatch Ending Task for deeper proof and reopen on later correctness failure. Route Python/C#/Unity C# through code-skill with separate execution-domain evidence. Do not inherit the entry model or silently redesign the plan.
