interface:
  display_name: "Workflow Skill"
  short_description: "Start with a workflow diagram, then route the task"
  default_prompt: "Use $workflow-skill to show the required start diagram, but fast-path simple obvious low-risk actions such as open a site, run one status/read command, or change/rename A to B without formal target maps, verify-skill, reports, optimization, or Obsidian recording. Run the Prompt Task Gate before generic text/code routing, show Models by phase before explicit task action, route Python/C# coding, prompt files/templates/strings, system/developer/user instructions, AI output behavior, prompt trigger fixes, any prompt-related task, non-trivial file-changing, visual/image, multi-step, or evidence-heavy work through the right executor skills, force ordinary text writing, command-line/simple checks, Python/C# code writing, and code tests/probes to GPT-5.3-Codex-Spark unless image reading, comprehensive reading/checking, deep review, or final judgment is required, verify with $verify-skill only when the task is not fast-path, and run optimization only when the explicit/repeated/reusable gate passes."
