interface:
  display_name: "Workflow"
  short_description: "Executes admitted complex delegated routes"
  default_prompt: >-
    $workflow-skill: eligible small low-risk edits try Spark; other producers use matching Obsidian context and saved quality pair. One receipt-backed Real PASS retains it; two PASS trial down; quality FAIL upgrades producer; operational failure is neutral. LOCKED_ROUTE_NODE publishes result/Quick Check only. After passing receipt parent captures immutable origin, exact project binding, and launches ending_verification_plan.py as one projectless End Task. Ending fixed gpt-5.3-codex-spark|xhigh; explicit unavailability only=>registry-floor gpt-5.6-luna|low; scores scope checks. All PASS, stay visible; never auto-archive/delete. Record difficulty/pairs, attempts, first/retry, suitability, Obsidian link; no receipt=>non-learning observation. FAIL/mismatch sends exact evidence via codex_app__send_message_to_thread; source session repairs, fresh projectless Spark-first verification, max 3. Never expose private reasoning, self-verify, or use a same-task subagent.
