interface:
  display_name: "workflow-skill"
  short_description: "Parallel tasks, bounded waits, and resource cleanup"
  default_prompt: "Follow Task Analyze's mandatory visible Skill reporting: exact names and short purposes at startup before tools, every progress update and phase transition, and final actual-use list including branches; announce new selections and distinguish planned from applied use. Preview difficulty, known models, branches and dependencies. Deliver requested work and repair recoverable failures. Start ready work promptly; bound polling. Separate submission and completion. Close unused owned tabs; preserve active work and review/reuse. Ending runs memory and resource audit in parallel."
