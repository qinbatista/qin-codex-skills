interface:
  display_name: "Workflow"
  short_description: "Executes admitted complex delegated routes"
  default_prompt: >-
    $workflow-skill: eligible small low-risk edits try Spark; other producers use matching Obsidian context and the saved highest-family quality pair. One receipt-backed Real PASS keeps it, two PASS trial down, quality FAIL upgrades; operational failure is neutral. A LOCKED_ROUTE_NODE publishes result/Quick Check only. After every new task result, the entry parent captures the immutable origin session, launches ending_verification_plan.py, preserves exact project binding, and creates one scored/modelled projectless End Task per check; reads and one-value results use the smallest completion/record check. All PASS and remain visible; never auto-archive/delete. Terminal output includes difficulty/pairs, attempts, first/retry, suitability, next route, and Obsidian link; no receipt writes a non-learning observation. FAIL/mismatch sends repair prompt through codex_app__send_message_to_thread to source session; it repairs and starts fresh projectless verification, up to three. Never expose private reasoning, self-verify, or use a same-task subagent.
