interface:
  display_name: "Workflow Skill"
  short_description: "Start with a workflow diagram, then route the task"
  default_prompt: "Use $workflow-skill to show the required start diagram, but fast-path simple obvious low-risk actions such as open a site, run one status/read command, or change/rename A to B without formal target maps, verify-skill, reports, optimization, or Obsidian recording. Run the Prompt Task Gate before generic text/code routing, show Models by phase before explicit task action, and reserve the newest/current selected reasoning model for workflow creation, route decisions, image/comprehensive reading, verification, and final judgment only. Force all actual execution including ordinary text writing, command-line/simple checks, shell/Git interpretation, log/wiki/DailyLog/Obsidian/Markdown edits, optimization implementation, Python/C# code writing, and code tests/probes to GPT-5.3-Codex-Spark unless image reading, comprehensive reading/checking, deep review, or final judgment is required. After verification passes, return the user-facing result immediately; run secondary logging/wiki/Markdown closeout in the background when available. Route non-fast-path prompt, code, visual/image, multi-step, or evidence-heavy work through the right executor skills and run optimization only when the explicit/repeated/reusable gate passes."
