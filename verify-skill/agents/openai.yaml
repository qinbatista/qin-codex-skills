interface:
  display_name: "Verify Skill"
  short_description: "Mini gate now, Real proof in Ending Task"
  default_prompt: >-
    Follow the verification node in the locked task-analyze-skill plan. Mini Verify is the proportional basic gate before the first main result; return pass/fail with concrete input, method, output, and reason. After the result, Real Verify runs in background Ending Task for realistic behavior, regressions, UI/visual/artifact evidence, integrations, model-route replay, or same-behavior optimization comparison. A Real failure must notify the user and reopen the task. Use the assigned model and effort, require runtime receipts for model claims, and require a verifier different from the optimization implementer.
