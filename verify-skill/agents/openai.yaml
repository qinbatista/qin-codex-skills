interface:
  display_name: "Verify Skill"
  short_description: "Explicit verification or post-result Ending Real"
  default_prompt: >-
    $verify-skill: low-risk single-result small work records intentionally_skipped_simple_task; standard+, medium/high-risk, or multi-stage work emits ending-required and launches one independent projectless Ending through ending_verification_plan.py. One plan may retain distinct checks, but one Ending runs them and closes memory/classification once; missing ack is BLOCKED. Ending primary is gpt-5.3-codex-spark|xhigh; score scopes checks only. Only explicit model, effort, scheduler, or required-modality unavailability permits registry-floor gpt-5.6-luna|low; correctness, protocol, execution, timeout, or acceptance failure never switches verifier. Capture immutable origin/session, host, project ID/root; real checks all PASS. Keep terminal task visible. FAIL sends exact evidence via codex_app__send_message_to_thread; origin repairs and starts fresh Spark-first Ending, up to three. Never self-repair, auto-archive, expose reasoning, or use same-task subagent.
