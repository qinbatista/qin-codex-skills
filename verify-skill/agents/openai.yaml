interface:
  display_name: "Verify Skill"
  short_description: "Real tests, reports, and verification"
  default_prompt: "After $workflow-skill routes the task here, use $verify-skill to verify the real outcome against the user's requirement. Verification judgment, comprehensive review, image/visual assessment, and final pass/fail decisions always use the best available verification/reasoning model by default. Default foreground gate is one mini real test: the smallest real input/output check that exercises the changed path and can catch a broken result. When that mini test passes, return the pass result immediately so the user gets the result faster. Run deeper real result testing, broad regression comparisons, log checks, docs/report indexing, and Obsidian regression sweeps as background follow-up unless the task is high-risk/destructive, touches security/payment/private data/production deployment/public API contracts, the mini test fails, or the user explicitly asks to wait for full testing. If background testing fails, reopen the task with failing evidence and repair. Do not call fake, shallow, compile-only, import-only, mock-only, route-listing-only, or bare PASS checks verified when a mini real edited-path test is practical. Use GPT-5.3-Codex-Spark / gpt-5.3-code-spark only for post-pass log/wiki/DailyLog/Obsidian/Markdown drafting or file edits."
