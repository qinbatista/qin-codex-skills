interface:
  display_name: "Verify Skill"
  short_description: "Mini gate now, Real proof in Ending Task"
  default_prompt: >-
    $verify-skill: run proportional Mini Verify before releasing the basically verified result, with concrete input, method, output, and reason. For mini_real, treat Mini PASS as provisional; Ending Real updates the same producer run and routing learning. A Real correctness failure notifies and reopens, while operational failures stay neutral. Use the assigned model|effort and receipts for model claims; optimization verification must use a different worker.
