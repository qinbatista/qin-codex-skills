  short_description: "Mini gate now, Real proof in Ending Task"
  default_prompt: >-
    $verify-skill: use the smallest Mini before release. Literal source/schema/string/syntax checks are local, not another model session. One repair may run inside the first-result deadline. Return the result before buffered Ending; easy exact work needs no model Real. Later Real failure reopens, operational failure stays neutral, and optimization needs a different verifier.
