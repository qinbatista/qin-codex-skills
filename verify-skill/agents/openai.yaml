interface:
  display_name: "Verify Skill"
  short_description: "Real tests, reports, and verification"
  default_prompt: "After $workflow-skill routes the task here, use $verify-skill to verify the real outcome against the user's requirement. Verification judgment, comprehensive review, image/visual assessment, and final pass/fail decisions always use the best available verification/reasoning model by default. Default to one mini real test: the smallest real input/output check that exercises the changed path and can catch a broken result. For major updates, broad/shared behavior, UI/generated artifacts, or when the user asks to test the edited result, run real result testing against the actual edited output. Do not call fake, shallow, compile-only, import-only, mock-only, route-listing-only, or bare PASS checks verified when a real edited-path test is practical; if only a shallow check is possible, state the untested scope. Run an Obsidian regression sweep for relevant prior repeated or fixed AI-caused project failures before pass verdicts, verify every applicable checklist item with per-item evidence, compare regressions when a baseline exists, apply artifact-specific visual standards, choose chat/Markdown/PDF evidence by complexity, try safe repair routes for fixable failures, and report the real input, method, output, Obsidian checklist verdicts, and pass or stop reason. Use GPT-5.3-Codex-Spark / gpt-5.3-code-spark only for post-pass log/wiki/DailyLog/Obsidian/Markdown drafting or file edits. After verification passes, return the pass result immediately and run secondary closeout in the background when available."
