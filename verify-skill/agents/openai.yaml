interface:
  display_name: "Verify Skill"
  short_description: "Real tests, reports, and verification"
  default_prompt: "After $workflow-skill routes the task here, use $verify-skill to run concrete evidence checks, verify real outcomes against the user's requirement, run an Obsidian regression sweep for relevant prior repeated or fixed AI-caused project failures before pass verdicts, verify every applicable checklist item with per-item evidence so old mistakes are not reintroduced by AI-written changes, compare regressions when a baseline exists, apply artifact-specific visual standards, choose chat/Markdown/PDF evidence by complexity, try safe repair routes for fixable failures, and report the real input, method, output, Obsidian checklist verdicts, and pass or stop reason. Use newest/current selected reasoning models only for verification judgment, comprehensive review, image/visual assessment, and final pass/fail decisions; use GPT-5.3-Codex-Spark for post-pass log/wiki/DailyLog/Obsidian/Markdown drafting or file edits. After verification passes, return the pass result immediately and run secondary closeout in the background when available."
