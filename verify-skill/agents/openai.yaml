interface:
  display_name: "Verify Skill"
  short_description: "Explicit verification or post-result Ending Real"
  default_prompt: >-
    $verify-skill: every user task launches an independent post-result Ending lifecycle, including exact read-only work. Resolve the exact saved project and use ending_verification_plan.py plus one project/local End Task-{task}-{check} per independent real check. Select each verifier from its own 0-100 score; all checks must PASS. Every terminal task stays visible; never auto-archive/delete. Print structured task/check difficulty, producer/verifier pairs, attempt count, first/retry pass, suitability, next pair/action, and Obsidian record link/status. Never summarize prior evidence instead of running the assigned check. FAIL records exact command/output/error, starts a same-project repair task, and then a fresh verifier, up to three attempts. BLOCKED never counts as verified. Never expose chain-of-thought, self-repair, or use a same-task subagent.
