interface:
  display_name: "Verify Skill"
  short_description: "Explicit verification or post-result Ending Real"
  default_prompt: >-
    $verify-skill: every user task launches an independent post-result Ending, including exact read-only work. Resolve the exact saved project and use ending_verification_plan.py plus one project/local End Task-{task}-{check} per real check. Score each verifier 0-100; all checks PASS. Every terminal task stays visible; never auto-archive/delete. Print task/check difficulty, producer/verifier pairs, attempt, first/retry, suitability, next route, and Obsidian record link/status. Without receipt, record a non-learning assignment observation. Run the check; never summarize old evidence. FAIL records exact command/output/error, starts same-project repair then a fresh verifier, up to three. BLOCKED is not verified. Never expose chain-of-thought, self-repair, or use a same-task subagent.
