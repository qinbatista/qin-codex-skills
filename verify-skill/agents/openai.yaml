interface:
  display_name: "Verify Skill"
  short_description: "Mini gate now, Real proof in Ending Task"
  default_prompt: >-
    $verify-skill: run proportional Mini Verify before releasing the basically verified result, with concrete input, method, output, and reason. Afterward, Ending Task runs Real Verify, regressions, artifact/integration checks, and optimization comparison. A Real correctness failure notifies and reopens. Use the assigned model|effort and receipts for model claims; optimization verification must use a different worker.
