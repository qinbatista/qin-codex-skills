interface:
  display_name: "Verify Skill"
  short_description: "Explicit verification or post-result Ending Real"
  default_prompt: >-
    $verify-skill: every new user task launches an independent post-result Ending in a projectless thread; reads, file opens, and one-value edits use a smallest completion/record check. Capture immutable origin thread/session, host, project ID, and root. Use ending_verification_plan.py plus one projectless End Task per check; preserve exact project binding as execution context. Score each verifier 0-100; all checks PASS. Every terminal task stays visible; never auto-archive/delete. Print difficulty/pairs, attempt, first/retry, suitability, next route, and Obsidian record link/status. Without receipt, record a non-learning assignment observation. Run check/acceptance; never summarize old evidence. FAIL/mismatch records exact command/output/error and sends repair prompt via codex_app__send_message_to_thread to immutable origin session; source starts fresh projectless verifier, up to three. BLOCKED is not verified. Never expose chain-of-thought, self-repair, or use same-task subagent.
