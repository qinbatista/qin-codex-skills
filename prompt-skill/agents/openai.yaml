interface:
  display_name: "Prompt Skill"
  short_description: "Global gate for reusable prompts and durable AI instructions"
  default_prompt: >-
    Always use $prompt-skill: this is the 100% global prompt-task gate for durable prompts/instructions; ordinary prose does not trigger it; present the artifact first. Reusable prompt changes are conceptual/process material: require projectless Ending plus durable memory unless explicit trivial_value_only. Spark-xhigh first; persisted real quota cooldown selects the next stronger controller. Failure creates independent projectless Repair, never contacts or interrupts existing sessions, waits for active write ownership, then fresh parent-linked Ending. Workers evidence-only.
