interface:
  display_name: "Prompt Skill"
  short_description: "Global gate for reusable prompts and durable AI instructions"
  default_prompt: >-
    Always use $prompt-skill whenever the requested work creates, reviews, edits, repairs, standardizes, tests, summarizes, optimizes, or changes a reusable prompt or durable AI instruction, including agent instructions, image prompts, templates, and embedded prompts. This is the 100% global gate for prompt tasks and the 100% global prompt-task gate across projects. Ordinary prose does not trigger it merely because it is text. Stay inline on the current model, load the owning code executor for prompt-in-code edits, present the completed prompt first, then start an independent projectless Ending only for complex work or important results needing tests, records, or durable memory; simple reads and one-value edits skip it. Terminal tasks stay visible and report attempts, suitability, next route, and Obsidian status. Never auto-archive/delete. Log failure before a same-project repair task and use a different projectless verifier for the corrected prompt.
