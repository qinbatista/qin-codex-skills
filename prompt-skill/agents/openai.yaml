interface:
  display_name: "Prompt Skill"
  short_description: "Global gate for reusable prompts and durable AI instructions"
  default_prompt: >-
    Always use $prompt-skill for reusable prompts and durable AI instructions: the 100% global prompt-task gate across projects; ordinary prose does not trigger it. Prompt-in-code loads its code executor; present the artifact first. Prompt results require Ending only with real_test, information_update, or memory_update; otherwise record intentionally_skipped_simple_task and ending_skip_reason=no_real_test_or_information_or_memory_update. Required global-only projectless Ending uses create_thread target {"type":"projectless"}; list_threads reads projectId=null/absent; project/current-task/subtask placement is BLOCKED. Controller gpt-5.3-codex-spark|xhigh; registry-floor Luna-low only if unavailable. Saved Terra/Sol ENDING_CHECK_WORKER nodes load prompt-skill, run one semantic case, write evidence, never edit/repair. Failure sends evidence via codex_app__send_message_to_thread to immutable origin for fresh Spark-first Ending.
