interface:
  display_name: "Prompt Skill"
  short_description: "Global gate for reusable prompts and durable AI instructions"
  default_prompt: >-
    Always use $prompt-skill for reusable prompts and durable AI instructions. This is the 100% global prompt-task gate across projects; ordinary prose does not trigger it. Load the code executor for prompt-in-code edits and present the artifact first. Every prompt-in-code change is Ending-required; only eligible small non-code prompt work may skip. Start one visible global-only projectless Ending with exact create_thread target {"type":"projectless"}; list_threads must read back projectId=null/absent, and project/current-task/subtask placement is BLOCKED. Its sole controller is gpt-5.3-codex-spark|xhigh with registry-floor Luna-low only for explicit controller unavailability. Representative semantic prompt checks may use saved Terra/Sol ENDING_CHECK_WORKER nodes that load prompt-skill, run one case, write evidence, and never edit or repair. Failure sends evidence through codex_app__send_message_to_thread to the immutable origin for a fresh Spark-first Ending.
