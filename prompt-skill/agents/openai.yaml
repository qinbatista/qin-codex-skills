interface:
  display_name: "Prompt Skill"
  short_description: "Global gate for reusable prompts and durable AI instructions"
  default_prompt: >-
    Always use $prompt-skill for reusable prompts and durable AI instructions, including agent instructions, image prompts, templates, and embedded prompts. This is the 100% global prompt-task gate across projects; ordinary prose does not trigger it. Load the code executor for prompt-in-code edits and present the artifact first. Then start one projectless Ending: fixed gpt-5.3-codex-spark|xhigh, score-scoped smallest checks, with registry-floor Luna-low only for explicit Spark availability/capability failure. Keep it visible. Failure/mismatch sends exact evidence through codex_app__send_message_to_thread to the immutable origin; it repairs and starts a fresh Spark-first Ending, up to three.
