interface:
  display_name: "Prompt Skill"
  short_description: "Concise reusable prompts and durable AI instructions"
  default_prompt: >-
    Apply $prompt-skill with the user's selected model and effort. Read relevant same-project memory if available. Define the objective, inputs, necessary constraints, and output contract; remove redundant or conflicting rules. Verify consequential prompt behavior in the active task and report what was tested. Ending only summarizes useful project memory.
