interface:
  display_name: "Prompt Skill"
  short_description: "Global gate for reusable prompts and durable AI instructions"
  default_prompt: >-
    Always use $prompt-skill for reusable prompts and durable AI instructions, including agent instructions, image prompts, templates, and embedded prompts. This is the 100% global gate and 100% global prompt-task gate across projects. Ordinary prose does not trigger it. Stay inline, load the code executor for prompt-in-code edits, present the completed prompt first, then start an independent projectless Ending for every new task; simple reads and one-value edits use a smallest completion/record check. Terminal tasks stay visible; never auto-archive/delete. On failure or mismatch, send the bounded repair prompt through `codex_app__send_message_to_thread` to the immutable origin session; it repairs and starts a fresh projectless verifier up to three times.
