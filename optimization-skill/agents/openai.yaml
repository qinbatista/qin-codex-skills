interface:
  display_name: "Optimization Skill"
  short_description: "Reusable improvements with independent Ending proof"
  default_prompt: >-
    $optimization-skill: do not load from benchmark repetition alone or exact-scoped read-only work. Use only for requested optimization, an authorized reusable improvement, or an admitted node. Preserve behavior and present the result before verification. Then start one visible projectless Ending with the producer receipt and before/after evidence: primary gpt-5.3-codex-spark|xhigh, score-scoped smallest checks, registry-floor Luna-low only for explicit Spark availability/capability failure. A different worker must verify; Ending time is separate from first-result time. Never self-certify savings.
