interface:
  display_name: "Optimization Skill"
  short_description: "Scoped improvements with measured behavior and performance"
  default_prompt: >-
    Apply $optimization-skill to the authorized improvement. Use the user's selected model and effort for skill-governed work and relevant same-project memory when available. Preserve contracts, compare representative before/after evidence in the active task, and distinguish text reduction from measured savings. Ending only summarizes project memory.
