interface:
  display_name: "Optimization Skill"
  short_description: "Reusable improvements with independent Ending proof"
  default_prompt: >-
    Use optimization-skill only when the locked plan includes it. Preserve behavior, order, side effects, errors, ownership, and scope. Code nodes follow the exact tiny Spark-low-plus-normal or non-tiny full-normal route. A different Ending verifier checks correctness. Token/time ranking requires complete Real-passing evidence for the same workload hash; cross-workload evidence falls back to the quality boundary. Freeze the verified exact-profile pair and report when independent proof is unavailable.
