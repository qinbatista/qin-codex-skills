interface:
  display_name: "Optimization Skill"
  short_description: "Reusable improvements with independent Ending proof"
  default_prompt: >-
    Use optimization-skill only when the locked task-analyze-skill plan includes it. Preserve observable behavior, order, side effects, errors, ownership, and scope. Use code-skill for Python/C# implementation and follow the planned model/effort instead of inheriting the entry model. If optimization is the requested result, implement the smallest safe change and return it to Mini Verify; if merely discovered, keep it in Ending Task. Same-behavior, token/time, and regression proof belongs after the main result to a different verify-skill worker. Report independent optimization verification blocked when no different verifier is callable.
