interface:
  display_name: "Management Skill"
  short_description: "Routing records, profiles, and six-skill mirror"
  default_prompt: >-
    $management-skill: manage private routing evidence and the approved mirror without exposing private state. Ending Real updates the producer and freezes best_pair. If Obsidian exists, also write a sanitized related TaskModelExperience projection; missing memory is a no-op and the private ledger remains authoritative. Cost-rank only same-hash Real passes. Never publish private state.
