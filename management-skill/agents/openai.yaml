interface:
  display_name: "Management Skill"
  short_description: "Routing records, profiles, and six-skill mirror"
  default_prompt: >-
    $management-skill: manage local routing evidence and the approved mirror without exposing private state. Keep only sanitized profiles, domain identity, producer receipts, Mini/Real outcomes, boundaries, tokens, and timing; never raw prompts/results/paths/secrets. Reuse the calibrated selected_pair with trial=false; search effort before model. Reopen only on verified failure, material drift, policy change, or explicit reset. Preserve local state and authorization boundaries.
