<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive routing versus fixed Sol ultra token benchmark</title>
  <desc id="desc">For an easy workload Spark low used 20,903 tokens versus Sol ultra at 27,041. For a complex workload Terra xhigh used 27,178 tokens versus Sol ultra at 27,218. Both outputs matched.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#17203a"/></linearGradient>
    <linearGradient id="adaptive" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="baseline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="600" rx="32" fill="url(#bg)"/>
  <text x="60" y="72" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">📊 Same workload · receipt-backed smoke comparison</text>
  <text x="60" y="111" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="19">Adaptive global route vs fixed gpt-5.6-sol | ultra · lower is better</text>

  <g transform="translate(60 155)" filter="url(#shadow)">
    <rect width="1080" height="170" rx="22" fill="#111c31" stroke="#29405f"/>
    <text x="28" y="42" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Easy deterministic transform</text>
    <text x="1020" y="42" text-anchor="end" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">−22.7% tokens · −38.3% time</text>
    <text x="28" y="86" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Spark-low</text>
    <rect x="185" y="67" width="463" height="26" rx="13" fill="url(#adaptive)"/>
    <text x="1040" y="87" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="17">20,903 tokens · 3.724s</text>
    <text x="28" y="132" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Sol-ultra</text>
    <rect x="185" y="113" width="600" height="26" rx="13" fill="url(#baseline)"/>
    <text x="1040" y="133" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="17">27,041 tokens · 6.036s</text>
  </g>

  <g transform="translate(60 350)" filter="url(#shadow)">
    <rect width="1080" height="170" rx="22" fill="#111c31" stroke="#29405f"/>
    <text x="28" y="42" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Complex dependency workflow</text>
    <text x="1020" y="42" text-anchor="end" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">−0.15% tokens · −9.3% time</text>
    <text x="28" y="86" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Terra-xhigh</text>
    <rect x="185" y="67" width="599.1" height="26" rx="13" fill="url(#adaptive)"/>
    <text x="1040" y="87" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="17">27,178 tokens · 5.483s</text>
    <text x="28" y="132" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Sol-ultra</text>
    <rect x="185" y="113" width="600" height="26" rx="13" fill="url(#baseline)"/>
    <text x="1040" y="133" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="17">27,218 tokens · 6.046s</text>
  </g>
  <text x="60" y="566" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="17">✓ identical outputs  ·  ✓ matching workload hashes  ·  ⚠ single run; use alternating medians for durable claims</text>
</svg>
