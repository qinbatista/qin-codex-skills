<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Real global strategy benchmark met the suite token goal but not the speed goal</title>
  <desc id="desc">Same-user-configuration receipt-backed comparison against direct Sol ultra. All six arms completed with exact deterministic output matches. Global used 14.482 percent fewer logical runtime tokens across the suite but took 39.186 percent more critical-path time. Simple and medium used more tokens and time; complex used 26.810 percent fewer tokens but 6.459 percent more time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#18223b"/></linearGradient>
    <linearGradient id="direct" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="loss" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="48" y="55" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">📊 Real A/B · lower is better</text>
  <text x="48" y="88" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="17">Same task + config + sandbox + acceptance · all unique runtime receipts counted</text>
  <g transform="translate(48 112)">
