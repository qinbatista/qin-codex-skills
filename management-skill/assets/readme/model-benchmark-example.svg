    <text x="574" y="88" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">TIME</text>
    <text x="24" y="115" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Direct</text><rect x="88" y="102" width="320" height="16" rx="8" fill="url(#direct)"/><text x="431" y="116" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">1,232,629</text>
    <text x="24" y="147" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Global</text><rect x="88" y="134" width="234" height="16" rx="8" fill="url(#win)"/><text x="345" y="148" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">902,163</text>
    <text x="574" y="115" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Direct</text><rect x="638" y="102" width="301" height="16" rx="8" fill="url(#direct)"/><text data-bound="right" x="1080" y="116" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">325.546s</text>
    <text x="574" y="147" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Global</text><rect x="638" y="134" width="320" height="16" rx="8" fill="url(#loss)"/><text data-bound="right" x="1080" y="148" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">346.572s</text>
  </g>
  <rect x="48" y="680" width="1104" height="64" rx="14" fill="#10291f" stroke="#0f766e"/>
  <text data-bound="center" x="310" y="707" text-anchor="middle" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">✅ TOKENS 1,404,182 → 1,200,826 (−14.482%)</text>
  <text data-bound="center" x="890" y="707" text-anchor="middle" fill="#fda4af" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">❌ TIME 383.657s → 533.998s (+39.186%)</text>
  <text data-bound="center" x="600" y="732" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">All six arms correct and complete · single run</text>
