    <text x="1080" y="34" text-anchor="end" fill="#fb7185" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">FAIL · +123.968% tokens · +320.068% time</text>
    <text x="24" y="61" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">Direct Sol-ultra vs Global Sol-ultra direct action</text>
    <text x="24" y="88" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">TOKENS</text>
    <text x="574" y="88" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">TIME</text>
    <text x="24" y="115" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Direct</text><rect x="88" y="102" width="143" height="16" rx="8" fill="url(#direct)"/><text x="254" y="116" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">53,781</text>
    <text x="24" y="147" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Global</text><rect x="88" y="134" width="320" height="16" rx="8" fill="url(#loss)"/><text x="431" y="148" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">120,452</text>
    <text x="574" y="115" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Direct</text><rect x="638" y="102" width="76" height="16" rx="8" fill="url(#direct)"/><text data-bound="right" x="1080" y="116" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">12.612s</text>
    <text x="574" y="147" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Global</text><rect x="638" y="134" width="320" height="16" rx="8" fill="url(#loss)"/><text data-bound="right" x="1080" y="148" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">52.979s</text>
  </g>
  <g transform="translate(48 302)">
    <rect width="1104" height="174" rx="20" fill="#101c31" stroke="#7c2d12"/>
    <text x="24" y="34" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">MEDIUM · both correct</text>
    <text x="1080" y="34" text-anchor="end" fill="#fb7185" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">FAIL · +51.319% tokens · +195.494% time</text>
