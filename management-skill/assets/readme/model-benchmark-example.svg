    <text x="24" y="147" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Global</text><rect x="88" y="134" width="320" height="16" rx="8" fill="url(#loss)"/><text x="431" y="148" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">178,211</text>
    <text x="574" y="115" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Direct</text><rect x="638" y="102" width="108" height="16" rx="8" fill="url(#direct)"/><text data-bound="right" x="1080" y="116" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">45.499s</text>
    <text x="574" y="147" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14">Global</text><rect x="638" y="134" width="320" height="16" rx="8" fill="url(#loss)"/><text data-bound="right" x="1080" y="148" text-anchor="end" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">134.447s</text>
  </g>
  <g transform="translate(48 492)">
    <rect width="1104" height="174" rx="20" fill="#101c31" stroke="#0f766e"/>
    <text x="24" y="34" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">COMPLEX · both correct</text>
    <text x="1080" y="34" text-anchor="end" fill="#fbbf24" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">PARTIAL · −26.810% tokens · +6.459% time</text>
    <text x="24" y="61" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">Direct Sol-ultra vs Global Sol-ultra entry → learned Sol-max producer</text>
