<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Complex task lifecycle</title>
  <desc id="desc">The selected entry model runs Task Analyze and selects a human route. Hookless Workflow executes per-node models, Mini Verify gates the main result, and background Ending Task follows afterward.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#15233d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1600" height="1280" rx="30" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="70" y="92" fill="#f8fafc" font-size="48" font-weight="800">🚀 How a complex task runs</text>
    <text x="70" y="136" fill="#94a3b8" font-size="24">The selected entry model does not become the workflow model. Hookless Workflow controls every later node.</text>

    <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M800 218 V270"/><path d="M800 390 V442"/><path d="M800 562 V614"/><path d="M800 734 V786"/><path d="M800 906 V958"/>
    </g>

    <g>
      <rect x="540" y="166" width="520" height="52" rx="26" fill="#172554" stroke="#60a5fa"/><text x="800" y="200" text-anchor="middle" fill="#dbeafe" font-size="23" font-weight="700">User request</text>

      <rect x="315" y="270" width="970" height="120" rx="22" fill="#0d2e35" stroke="#2dd4bf" stroke-width="2"/>
      <text x="350" y="312" fill="#99f6e4" font-size="18" font-weight="800">🧭 task-analyze-skill · 100% ENTRY</text><text x="350" y="348" fill="#f8fafc" font-size="25" font-weight="700">[Selected entry model | selected effort]</text><text x="850" y="348" fill="#cbd5e1" font-size="21">Choose skill + model + effort per node</text>

      <rect x="315" y="442" width="970" height="120" rx="22" fill="#122844" stroke="#60a5fa" stroke-width="2"/>
      <text x="350" y="484" fill="#bfdbfe" font-size="18" font-weight="800">🗺️ SHOW HUMAN ROUTE</text><text x="350" y="520" fill="#f8fafc" font-size="25" font-weight="700">[Entry pair ends here]</text><text x="770" y="520" fill="#cbd5e1" font-size="21">Hookless Workflow starts after the visible route</text>

      <rect x="115" y="614" width="430" height="120" rx="22" fill="#302716" stroke="#fbbf24" stroke-width="2"/><text x="145" y="656" fill="#fde68a" font-size="18" font-weight="800">💻 CODE BRANCH</text><text x="145" y="694" fill="#f8fafc" font-size="22" font-weight="700">code-skill</text><text x="315" y="694" fill="#cbd5e1" font-size="19">[Spark | medium]</text>
      <rect x="585" y="614" width="430" height="120" rx="22" fill="#162d28" stroke="#34d399" stroke-width="2"/><text x="615" y="656" fill="#a7f3d0" font-size="18" font-weight="800">🗺️ WORKFLOW BRANCH</text><text x="615" y="694" fill="#f8fafc" font-size="22" font-weight="700">workflow-skill</text><text x="805" y="694" fill="#cbd5e1" font-size="19">[Terra | high]</text>
      <rect x="1055" y="614" width="430" height="120" rx="22" fill="#3b1c2a" stroke="#fb7185" stroke-width="2"/><text x="1085" y="656" fill="#fecdd3" font-size="18" font-weight="800">🔐 MANAGEMENT BRANCH</text><text x="1085" y="694" fill="#f8fafc" font-size="22" font-weight="700">management-skill</text><text x="1320" y="694" fill="#cbd5e1" font-size="19">[Luna | medium]</text>
      <path d="M800 562 V586 H330 V614 M800 586 V614 M800 586 H1270 V614" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
      <path d="M330 734 V760 H800 V786 M800 734 V786 M1270 734 V760 H800" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

      <rect x="315" y="786" width="970" height="120" rx="22" fill="#162d28" stroke="#34d399" stroke-width="2"/>
      <text x="350" y="828" fill="#a7f3d0" font-size="18" font-weight="800">🧪 MINI VERIFY · FIRST-RESULT GATE</text><text x="350" y="866" fill="#f8fafc" font-size="25" font-weight="700">[planned model | planned effort]</text><text x="850" y="866" fill="#cbd5e1" font-size="21">Basic check · repair before result</text>

      <rect x="315" y="958" width="970" height="120" rx="22" fill="#172554" stroke="#818cf8" stroke-width="2"/>
      <text x="350" y="1000" fill="#c7d2fe" font-size="18" font-weight="800">✅ MAIN GOAL DONE GATE</text><text x="350" y="1038" fill="#f8fafc" font-size="27" font-weight="750">📣 Show the main result now</text><text x="850" y="1038" fill="#cbd5e1" font-size="21">Requested work + Mini Verify passed</text>

      <rect x="70" y="1128" width="1460" height="100" rx="22" fill="#24173c" stroke="#c084fc" stroke-width="2"/>
      <text x="105" y="1170" fill="#e9d5ff" font-size="18" font-weight="800">🌙 AFTER THE RESULT · ENDING TASK</text><text x="105" y="1205" fill="#f8fafc" font-size="22">🔬 Real Verify [Terra | high]</text><text x="540" y="1205" fill="#f8fafc" font-size="22">⚡ Independent optimization verifier [Terra | high]</text><text x="1110" y="1205" fill="#f8fafc" font-size="22">📝 Records [Luna | low]</text>
      <path d="M800 1078 V1128" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    </g>
    <text x="800" y="1260" text-anchor="middle" fill="#fca5a5" font-size="20" font-weight="700">Background correctness failure → 🚨 notify the user + reopen the task</text>
  </g>
</svg>
