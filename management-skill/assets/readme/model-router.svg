<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Model and effort router</title>
  <desc id="desc">Any selected entry pair runs Task Analyze and route selection only. Sol, Terra, Luna, and Spark are then selected per downstream node with supported effort.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17223d"/></linearGradient></defs>
  <rect width="1600" height="1040" rx="30" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="70" y="92" fill="#f8fafc" font-size="48" font-weight="800">🤖 Model + effort router</text>
    <text x="70" y="136" fill="#94a3b8" font-size="24">The entry pair selects the route. Workflow launches each downstream model afterward.</text>
    <rect x="70" y="180" width="1460" height="130" rx="22" fill="#0d2e35" stroke="#2dd4bf" stroke-width="2"/>
    <text x="105" y="222" fill="#99f6e4" font-size="18" font-weight="800" letter-spacing="1.5">ENTRY MODEL BOUNDARY</text>
    <text x="105" y="262" fill="#f8fafc" font-size="25" font-weight="700">Any selected entry pair runs Task Analyze + routing only. It does not propagate.</text>
    <text x="105" y="292" fill="#cbd5e1" font-size="20">Extreme example: GPT-5.6-Sol | ultra → Task Analyze + routing only</text>

    <g>
      <rect x="70" y="355" width="710" height="250" rx="24" fill="#201a3a" stroke="#a78bfa" stroke-width="2"/>
      <text x="105" y="405" fill="#ddd6fe" font-size="20" font-weight="800">GPT-5.6-Sol</text><text x="105" y="450" fill="#f8fafc" font-size="27" font-weight="750">Open-ended reasoning</text><text x="105" y="492" fill="#cbd5e1" font-size="21">Ambiguous architecture · missing context</text><text x="105" y="526" fill="#cbd5e1" font-size="21">difficult synthesis · complex judgment</text><rect x="105" y="550" width="610" height="36" rx="18" fill="#312e58"/><text x="410" y="575" text-anchor="middle" fill="#ede9fe" font-size="17" font-weight="700">low · medium · high · xhigh · max · ultra</text>
      <rect x="820" y="355" width="710" height="250" rx="24" fill="#102b3d" stroke="#38bdf8" stroke-width="2"/>
      <text x="855" y="405" fill="#bae6fd" font-size="20" font-weight="800">GPT-5.6-Terra</text><text x="855" y="450" fill="#f8fafc" font-size="27" font-weight="750">Grounded integration</text><text x="855" y="492" fill="#cbd5e1" font-size="21">Source-rich changes · repository search</text><text x="855" y="526" fill="#cbd5e1" font-size="21">realistic verification · evidence review</text><rect x="855" y="550" width="610" height="36" rx="18" fill="#123b55"/><text x="1160" y="575" text-anchor="middle" fill="#e0f2fe" font-size="17" font-weight="700">low · medium · high · xhigh · max · ultra</text>
      <rect x="70" y="645" width="710" height="250" rx="24" fill="#123227" stroke="#34d399" stroke-width="2"/>
      <text x="105" y="695" fill="#a7f3d0" font-size="20" font-weight="800">GPT-5.6-Luna</text><text x="105" y="740" fill="#f8fafc" font-size="27" font-weight="750">Bounded delivery</text><text x="105" y="782" fill="#cbd5e1" font-size="21">Direct non-code work · Mini Verify</text><text x="105" y="816" fill="#cbd5e1" font-size="21">result delivery · reports · logs · docs</text><rect x="105" y="840" width="610" height="36" rx="18" fill="#174936"/><text x="410" y="865" text-anchor="middle" fill="#d1fae5" font-size="17" font-weight="700">low · medium · high · xhigh · max</text>
      <rect x="820" y="645" width="710" height="250" rx="24" fill="#302716" stroke="#fbbf24" stroke-width="2"/>
      <text x="855" y="695" fill="#fde68a" font-size="20" font-weight="800">GPT-5.3-Codex-Spark</text><text x="855" y="740" fill="#f8fafc" font-size="27" font-weight="750">Text-only Python/C#</text><text x="855" y="782" fill="#cbd5e1" font-size="21">Implementation · Unity C# · repair</text><text x="855" y="816" fill="#cbd5e1" font-size="21">refactor · authored Python/C# probes</text><rect x="855" y="840" width="610" height="36" rx="18" fill="#4a3717"/><text x="1160" y="865" text-anchor="middle" fill="#fef3c7" font-size="17" font-weight="700">low · medium · high · xhigh</text>
    </g>

    <rect x="70" y="935" width="1460" height="68" rx="20" fill="#111d32" stroke="#475569"/>
    <text x="105" y="977" fill="#f8fafc" font-size="21" font-weight="700">Selected entry model ≠ workflow-wide model</text><text x="590" y="977" fill="#cbd5e1" font-size="20">Every node shows exact [model | effort].</text><text x="1080" y="977" fill="#fbbf24" font-size="20" font-weight="700">Runtime evidence—not a label—proves execution.</text>
  </g>
</svg>
