<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1620" viewBox="0 0 600 1620" role="img" aria-labelledby="title desc">
  <title id="title">Condition-keyed model experience mobile diagram</title>
  <desc id="desc">A mobile flow from the current entry pair through Task Analyze, exact condition matching, recommendation, receipt-backed workflow, Mini record, main result, and background Real update. Pass lowers effort then model; quality failure raises a sticky failed boundary; local data is never pushed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17223d"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#67e8f9"/></marker>
    <style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
  </defs>
  <rect width="600" height="1620" rx="32" fill="url(#bg)"/>
  <text x="300" y="62" text-anchor="middle" fill="#f8fafc" font-size="32" font-weight="800">Model experience</text>
  <text x="300" y="94" text-anchor="middle" fill="#94a3b8" font-size="17">condition-keyed · receipt-backed · private</text>
  <g stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M300 245V285"/><path d="M300 425V465"/><path d="M300 605V645"/><path d="M300 785V825"/><path d="M300 965V1005"/><path d="M300 1145V1185"/><path d="M300 1325V1365"/>
  </g>
  <g>
    <rect x="45" y="135" width="510" height="110" rx="22" fill="#0d2e35" stroke="#2dd4bf" stroke-width="2"/>
    <text x="300" y="177" text-anchor="middle" fill="#99f6e4" font-size="20" font-weight="800">CURRENT PAIR → TASK ANALYZE ONLY</text>
    <text x="300" y="211" text-anchor="middle" fill="#f8fafc" font-size="18">model | effort is not workflow-wide</text>
    <rect x="45" y="315" width="510" height="110" rx="22" fill="#201a3a" stroke="#a78bfa" stroke-width="2"/>
    <text x="300" y="357" text-anchor="middle" fill="#ddd6fe" font-size="20" font-weight="800">GENERALIZED CONDITION</text>
    <text x="300" y="391" text-anchor="middle" fill="#f8fafc" font-size="18">exact controlled fields, not model-keyed</text>
    <rect x="45" y="495" width="510" height="110" rx="22" fill="#102b3d" stroke="#38bdf8" stroke-width="2"/>
    <text x="300" y="537" text-anchor="middle" fill="#bae6fd" font-size="20" font-weight="800">RECOMMENDATION BRANCH</text>
    <text x="300" y="571" text-anchor="middle" fill="#f8fafc" font-size="18">effort first → then model; floors win</text>
    <rect x="45" y="675" width="510" height="110" rx="22" fill="#123227" stroke="#34d399" stroke-width="2"/>
    <text x="300" y="717" text-anchor="middle" fill="#a7f3d0" font-size="20" font-weight="800">RECEIPT-BACKED WORKFLOW</text>
    <text x="300" y="751" text-anchor="middle" fill="#f8fafc" font-size="18">attribute the original producer attempt</text>
    <rect x="45" y="855" width="510" height="110" rx="22" fill="#312e58" stroke="#a78bfa" stroke-width="2"/>
    <text x="300" y="897" text-anchor="middle" fill="#ede9fe" font-size="20" font-weight="800">MINI RECORD</text>
    <text x="300" y="931" text-anchor="middle" fill="#f8fafc" font-size="18">first gate; start the sticky quality boundary</text>
    <rect x="45" y="1035" width="510" height="110" rx="22" fill="#123227" stroke="#34d399" stroke-width="2"/>
    <text x="300" y="1077" text-anchor="middle" fill="#a7f3d0" font-size="20" font-weight="800">MAIN RESULT</text>
    <text x="300" y="1111" text-anchor="middle" fill="#f8fafc" font-size="18">show when Mini passes</text>
    <rect x="45" y="1215" width="510" height="110" rx="22" fill="#302716" stroke="#fbbf24" stroke-width="2"/>
    <text x="300" y="1257" text-anchor="middle" fill="#fde68a" font-size="20" font-weight="800">BACKGROUND REAL UPDATE</text>
    <text x="300" y="1291" text-anchor="middle" fill="#fef3c7" font-size="18">same attempt; reopen on correctness failure</text>
  </g>
  <rect x="45" y="1385" width="510" height="180" rx="22" fill="#111d32" stroke="#475569" stroke-width="2"/>
  <text x="70" y="1425" fill="#34d399" font-size="18" font-weight="800">PASS</text><text x="190" y="1425" fill="#e2e8f0" font-size="17">same-model effort, then model</text>
  <text x="70" y="1465" fill="#fb7185" font-size="18" font-weight="800">QUALITY FAIL</text><text x="215" y="1465" fill="#e2e8f0" font-size="17">raise sticky boundary</text>
  <text x="70" y="1505" fill="#67e8f9" font-size="18" font-weight="800">SPARK-LOW</text><text x="205" y="1505" fill="#e2e8f0" font-size="17">tiny text/code/command</text>
  <text x="70" y="1545" fill="#fbbf24" font-size="18" font-weight="800">PRIVATE</text><text x="185" y="1545" fill="#fef3c7" font-size="17">local JSON never pushed</text>
</svg>
