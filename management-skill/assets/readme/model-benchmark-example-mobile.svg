<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive routing versus fixed Sol ultra token benchmark</title>
  <desc id="desc">Spark low saved 22.7 percent tokens on the easy workload. Terra xhigh used nearly equal tokens and 9.3 percent less process time on the complex workload. Outputs matched.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#17203a"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
  </defs>
  <rect width="720" height="860" rx="30" fill="url(#bg)"/>
  <text x="40" y="62" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">📊 Receipt-backed smoke test</text>
  <text x="40" y="98" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="17">Adaptive route vs fixed Sol-ultra</text>
  <g transform="translate(40 135)">
    <rect width="640" height="290" rx="22" fill="#111c31" stroke="#29405f"/>
    <text x="24" y="43" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Easy transform</text>
    <text x="24" y="78" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">−22.7% tokens · −38.3% time</text>
    <text x="24" y="126" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Spark-low · 20,903</text>
    <rect x="24" y="141" width="456" height="30" rx="15" fill="url(#a)"/>
    <text x="24" y="211" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Sol-ultra · 27,041</text>
    <rect x="24" y="226" width="590" height="30" rx="15" fill="url(#b)"/>
  </g>
  <g transform="translate(40 450)">
    <rect width="640" height="290" rx="22" fill="#111c31" stroke="#29405f"/>
    <text x="24" y="43" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Complex workflow</text>
    <text x="24" y="78" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">−0.15% tokens · −9.3% time</text>
    <text x="24" y="126" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Terra-xhigh · 27,178</text>
    <rect x="24" y="141" width="589" height="30" rx="15" fill="url(#a)"/>
    <text x="24" y="211" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Sol-ultra · 27,218</text>
    <rect x="24" y="226" width="590" height="30" rx="15" fill="url(#b)"/>
  </g>
  <text x="40" y="788" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">✓ outputs match · ✓ workload hashes match</text>
  <text x="40" y="820" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">⚠ one run; use alternating medians for durable claims</text>
</svg>
