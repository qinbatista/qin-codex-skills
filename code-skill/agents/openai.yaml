interface:
  display_name: "Code Skill"
  short_description: "Universal code-writing process and domain executor"
  default_prompt: >-
    $code-skill: artifact-free exact read-only lookup/audit stays skill-free; all code writing, even owned by another Skill, loads references/code-writing-philosophy.md. Before Unity game C# writing, read nearest AGENTS.md and references/unity-game-code-structure-design.md; local may tighten, not weaken its Controller/Manager/ScriptableObject core. Requested Cache/report output requires the runner. Score every submission 0-100; small low-risk edit tries Spark-low; quality failure suppresses the matching band. Every new user task captures immutable origin session; smallest completion/record check still uses ending_verification_plan.py and a projectless End Task; exact project binding remains execution context; all must PASS and remain visible. Never auto-archive/delete. Record difficulty/pairs, attempts, first/retry pass, suitability, and Obsidian link. On mismatch, codex_app__send_message_to_thread repairs in the source session, then fresh projectless verification. Never self-verify or use a same-task subagent.
