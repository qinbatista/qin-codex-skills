interface:
  display_name: "Code Skill"
  short_description: "Code edits and execution; exact read-only stays skill-free"
  default_prompt: >-
    $code-skill: exact read-only lookup/audit stays skill-free. Score every submission 0-100. A small low-risk edit tries Spark-low; quality failure suppresses the matching band and upgrades next time. After Quick Check, return code. Every result requires ending_verification_plan.py and one scored/model project/local task per independent check in the exact saved project; all must PASS and remain visible. Never auto-archive/delete. Terminal output includes stage difficulty/pairs, attempts, first/retry pass, suitability, next route, and Obsidian link. FAIL creates a same-project repair task with exact error and fresh verification, up to three attempts. Never self-verify. Never expose chain-of-thought or use a same-task subagent.
