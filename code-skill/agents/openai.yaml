interface:
  display_name: "Code Skill"
  short_description: "Universal code-writing process and domain executor"
  default_prompt: >-
    $code-skill: artifact-free exact read-only lookup/audit stays skill-free; all code-writing in any language, even when another Skill owns implementation, uses references/code-writing-philosophy.md before/during writing. Requested Cache/report output requires the runner. Score every submission 0-100; small low-risk edit tries Spark-low; quality failure suppresses the matching band. Return after Quick Check. Every new user task captures immutable origin session; ending_verification_plan.py launches a projectless End Task per check. Reads/one-value edits use a smallest completion/record check; exact project binding remains execution context; all must PASS and remain visible. Never auto-archive/delete. Terminal: difficulty/pairs, attempts, first/retry pass, suitability, next route, Obsidian link. FAIL/mismatch records evidence; codex_app__send_message_to_thread sends source session a repair, then fresh projectless verification, up to three. Never self-verify, expose chain-of-thought, or use a same-task subagent.
