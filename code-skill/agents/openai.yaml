interface:
  display_name: "Code Skill"
  short_description: "Code work; artifact-free read-only stays skill-free"
  default_prompt: >-
    $code-skill: artifact-free exact read-only lookup/audit stays skill-free; requested Cache/report output requires the runner. Score every submission 0-100. A small low-risk edit tries Spark-low; quality failure suppresses the matching band and upgrades next time. After Quick Check, return code. Complex/important results needing tests, records, or durable memory use ending_verification_plan.py and one scored/model projectless End Task per independent check; simple reads, file opens, and one-value edits skip Ending; exact project binding remains execution context. All must PASS and remain visible. Never auto-archive/delete. Terminal output includes stage difficulty/pairs, attempts, first/retry pass, suitability, next route, and Obsidian link. FAIL creates a same-project repair task with exact error and fresh projectless verification, up to three attempts. Never self-verify. Never expose chain-of-thought or use a same-task subagent.
