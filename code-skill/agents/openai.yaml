interface:
  display_name: "Code Skill"
  short_description: "Spark-first registered code-domain executor"
  default_prompt: >-
    $code-skill: execute every active registry-owned code domain named by the locked plan. Follow its exact model|effort; Spark is first for text-only implementation and probes, with only visible fallbacks. Read the matching coding/language references, preserve local style, keep edits surgical, and return Mini Verify evidence. The basically verified result comes before Ending Task's deeper code-path checks and independent optimization proof.
