interface:
  display_name: "Code Skill"
  short_description: "Code work; artifact-free read-only stays skill-free"
  default_prompt: >-
    $code-skill: artifact-free exact read-only lookup/audit stays skill-free; requested Cache/report output requires the runner. Score every submission 0-100. small low-risk edit tries Spark-low; quality failure suppresses the matching band. After Quick Check, return code. Every new user task captures immutable origin session and uses ending_verification_plan.py plus one scored/model projectless End Task per check; reads, file opens, and one-value edits use a smallest completion/record check; exact project binding remains execution context. All must PASS and remain visible. Never auto-archive/delete. Terminal output includes difficulty/pairs, attempts, first/retry pass, suitability, next route, and Obsidian link. FAIL/mismatch records evidence and sends repair prompt via codex_app__send_message_to_thread to source session; it repairs and starts fresh projectless verification, up to three. Never self-verify or expose chain-of-thought/use a same-task subagent.
